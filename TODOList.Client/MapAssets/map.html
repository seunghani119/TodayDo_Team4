<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TodayDo 장소 선택</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            font: 14px "Malgun Gothic", sans-serif;
            color: darkslategray;
            background: whitesmoke;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid gainsboro;
            border-radius: 10px;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            color: darkslateblue;
            background: lavender;
            font: inherit;
        }

            button:disabled {
                cursor: default;
                opacity: 0.5;
            }

        #workspace {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        aside {
            width: 250px;
            display: flex;
            flex-direction: column;
            background: white;
        }

        #results {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .result {
            display: block;
            text-align: left;
            width: 100%;
            background: ghostwhite;
            margin-bottom: 8px;
        }

            .result:hover, .result:focus {
                background: lavender;
            }

            .result span {
                display: block;
                margin-top: 6px;
                color: slategray;
                line-height: 1.6;
            }

        #pages {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        #map {
            flex: 1;
            min-width: 0;
        }

        #hint {
            margin: 0;
            padding: 8px 12px;
            color: slategray;
        }
    </style>
</head>
<body>
    <form id="searchForm">
        <input id="keyword" placeholder="장소 이름 또는 주소를 검색하세요" aria-label="장소 이름 또는 주소" disabled>
        <button id="searchButton" disabled>검색</button>
    </form>
    <div id="workspace">
        <aside>
            <div id="results" aria-live="polite">검색하거나 지도에서 원하는 위치를 클릭해 주세요.</div>
            <div id="pages">
                <button id="previous" type="button" disabled>이전</button>
                <span id="pageLabel"></span>
                <button id="next" type="button" disabled>다음</button>
            </div>
        </aside>
        <div id="map"></div>
    </div>
    <p id="hint">지도에서 선택한 위치는 아래 ‘이 위치 선택’을 눌러 확정합니다.</p>

    <script>
        const $ = id => document.getElementById(id);
        const send = data => window.chrome.webview.postMessage(data);
        const appKey = "b2d036652294088a169ee9949d7d193b";

        function startMap() {
            const map = new kakao.maps.Map($("map"), { center: new kakao.maps.LatLng(36.3504, 127.3845), level: 7 });
            const marker = new kakao.maps.Marker();
            const places = new kakao.maps.services.Places();
            const geocoder = new kakao.maps.services.Geocoder();
            let version = 0;
            let currentPage = 1;

            function loading() {
                marker.setMap(null);
                send({ type: "loading" });
            }

            function fail(message) {
                $("hint").textContent = message;
                send({ type: "error", message });
            }

            function select(latitude, longitude, locationName, address) {
                ++version;
                const point = new kakao.maps.LatLng(latitude, longitude);
                marker.setPosition(point);
                marker.setMap(map);
                map.panTo(point);
                $("hint").textContent = locationName === address ? address : `${locationName} · ${address}`;
                send({ type: "selected", locationName, address, latitude, longitude });
            }

            function showResults(items, addressOnly = false) {
                $("results").replaceChildren();
                const bounds = new kakao.maps.LatLngBounds();

                for (const item of items) {
                    const address = addressOnly
                        ? item.road_address?.address_name || item.address_name
                        : item.road_address_name || item.address_name;
                    const name = addressOnly ? address : item.place_name;
                    const latitude = Number(item.y);
                    const longitude = Number(item.x);
                    if (!address || !Number.isFinite(latitude) || !Number.isFinite(longitude)) continue;

                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "result";
                    const title = document.createElement("strong");
                    const description = document.createElement("span");
                    title.textContent = name;
                    description.textContent = address;
                    button.append(title, description);
                    button.onclick = () => select(latitude, longitude, name, address);
                    $("results").appendChild(button);
                    bounds.extend(new kakao.maps.LatLng(latitude, longitude));
                }

                if ($("results").children.length) map.setBounds(bounds);
                $("hint").textContent = "검색 결과를 선택하거나 지도에서 위치를 클릭해 주세요.";
            }

            function search(page = 1) {
                const keyword = $("keyword").value.trim();
                if (!keyword) { $("keyword").focus(); return; }
                const request = ++version;
                loading();
                $("results").textContent = "장소를 검색하고 있습니다.";
                $("previous").disabled = true;
                $("next").disabled = true;
                $("pageLabel").textContent = "";

                places.keywordSearch(keyword, (items, status, pagination) => {
                    if (request !== version) return;

                    if (status === kakao.maps.services.Status.OK) {
                        currentPage = pagination.current;
                        showResults(items);
                        $("pageLabel").textContent = `${currentPage} 페이지`;
                        $("previous").disabled = !pagination.hasPrevPage;
                        $("next").disabled = !pagination.hasNextPage;
                        return;
                    }

                    if (status !== kakao.maps.services.Status.ZERO_RESULT) {
                        $("results").textContent = "검색하지 못했습니다.";
                        fail("장소 검색에 실패했습니다. 카카오 설정과 인터넷 연결을 확인해 주세요.");
                        return;
                    }

                    // 장소 이름으로 찾지 못하면 주소로도 검색합니다.
                    geocoder.addressSearch(keyword, (addresses, addressStatus) => {
                        if (request !== version) return;
                        if (addressStatus === kakao.maps.services.Status.OK) {
                            showResults(addresses, true);
                        } else {
                            $("results").textContent = "검색 결과가 없습니다. 다른 검색어를 입력해 주세요.";
                            fail("주소를 찾지 못했습니다. 검색어를 확인하거나 지도에서 직접 선택해 주세요.");
                        }
                    });
                }, { page, size: 15 });
            }

            kakao.maps.event.addListener(map, "click", event => {
                const request = ++version;
                const point = event.latLng;
                loading();
                geocoder.coord2Address(point.getLng(), point.getLat(), (items, status) => {
                    if (request !== version) return;
                    const address = items?.[0]?.road_address?.address_name || items?.[0]?.address?.address_name;
                    if (status !== kakao.maps.services.Status.OK || !address) {
                        fail("주소를 확인할 수 없는 위치입니다. 다른 지점을 선택해 주세요.");
                        return;
                    }
                    select(point.getLat(), point.getLng(), address, address);
                });
            });

            $("searchForm").onsubmit = event => { event.preventDefault(); search(); };
            $("previous").onclick = () => search(currentPage - 1);
            $("next").onclick = () => search(currentPage + 1);
            $("keyword").disabled = false;
            $("searchButton").disabled = false;
            send({ type: "ready" });
        }

        const script = document.createElement("script");
        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(appKey)}&libraries=services&autoload=false`;
        script.onload = () => {
            if (window.kakao?.maps) kakao.maps.load(startMap);
            else send({ type: "error", message: "지도 SDK를 사용할 수 없습니다. JavaScript 키와 도메인을 확인해 주세요." });
        };
        script.onerror = () => send({ type: "error", message: "지도를 불러오지 못했습니다. 카카오 설정과 인터넷 연결을 확인해 주세요." });
        document.head.appendChild(script);
    </script>
</body>
</html>
